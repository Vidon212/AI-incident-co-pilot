name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: make test
      - name: Build container
        run: make docker-build
      - name: Check packaged CLI examples
        run: |
          make -s docker-run > /tmp/triage.json
          make -s docker-verify > /tmp/verification.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.evaluation_cli \
            --dataset examples/evaluation/incidents.json \
            --candidate examples/evaluation/candidate.json \
            --baseline examples/evaluation/baseline.json \
            --policy examples/evaluation/promotion-policy.json > /tmp/evaluation.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.rollout_cli promotion \
            --context examples/rollout/context.json \
            --request examples/rollout/autonomy-request.json \
            --replay examples/rollout/replay.json > /tmp/rollout.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.events_cli --context examples/events/context.json \
            --deliveries examples/events/checkout-deliveries.json \
            --state :memory: > /tmp/events.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.pr_risk_cli --changes examples/pr-risk/review-changes.json \
            --context examples/pr-risk/review-context.json > /tmp/risk-review.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.graph_cli --graph examples/graph/platform.json \
            --query examples/graph/database-impact.json \
            --documents examples/graph/documents.json \
            --question 'What depends on this database?' > /tmp/graph.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.impact_cli --change examples/impact/replicas-change.json \
            --context examples/impact/replicas-context.json --graph examples/impact/platform.json \
            --assessment examples/impact/replicas-assessment.json > /tmp/impact-review.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.autonomy_cli --proposal examples/autonomy/hpa-proposal.json \
            --context examples/autonomy/hpa-context.json \
            --capability-platform examples/rollout/capability-platform.json \
            --replay examples/rollout/replay.json > /tmp/autonomy.json
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.autonomy_cli --proposal examples/autonomy/rollback-proposal.json \
            --context examples/autonomy/migration-context.json > /tmp/autonomy-migration.json
          if docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.impact_cli --change examples/impact/node-pool-change.json \
            --context examples/impact/node-pool-context.json \
            --graph examples/impact/platform.json > /tmp/impact-blocked.json; then
            echo "Expected the CPU capacity contradiction to be blocked" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          if docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ai-incident-copilot:local \
            incident_copilot.pr_risk_cli --changes examples/pr-risk/unsafe-changes.json \
            --context examples/pr-risk/unsafe-context.json \
            --assessment examples/pr-risk/unsafe-assessment.json > /tmp/risk-blocked.json; then
            echo "Expected the unsafe change set to be blocked" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/triage.json').read_text())['decision'] == 'requires_human_approval'
          assert json.loads(Path('/tmp/verification.json').read_text())['outcome'] == 'SUCCESS'
          assert json.loads(Path('/tmp/evaluation.json').read_text())['decision'] == 'pass'
          assert json.loads(Path('/tmp/rollout.json').read_text())['decision'] == 'eligible_for_next_stage'
          assert json.loads(Path('/tmp/events.json').read_text())['incidents'][0]['phase'] == 'resolved'
          assert json.loads(Path('/tmp/risk-review.json').read_text())['decision'] == 'requires_human_review'
          assert json.loads(Path('/tmp/risk-blocked.json').read_text())['decision'] == 'block'
          graph = json.loads(Path('/tmp/graph.json').read_text())
          assert graph['decision'] == 'context_available'
          assert not graph['mutation_authorized']
          assert {item['service'] for item in graph['knowledge']} == {'checkout-api', 'inventory-api'}
          assert all(item['result']['decision'] == 'grounded' for item in graph['knowledge'])
          impact = json.loads(Path('/tmp/impact-review.json').read_text())
          assert impact['decision'] == 'requires_human_review'
          assert impact['capacity']['controller']['required_replicas'] == 17
          assert impact['model_explanations']
          assert not impact['merge_authorized']
          assert json.loads(Path('/tmp/impact-blocked.json').read_text())['decision'] == 'block'
          autonomy = json.loads(Path('/tmp/autonomy.json').read_text())
          assert autonomy['autonomy_level'] == 5
          assert not autonomy['execution_authorized']
          assert autonomy['transaction']['unexpected_signal'] == 'freeze_and_escalate'
          assert json.loads(Path('/tmp/autonomy-migration.json').read_text())['autonomy_level'] == 2
          PY
