[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-copilot"
version = "0.1.0"
description = "A safety-first incident triage copilot foundation."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint."messages control"]
disable = [
    "duplicate-code", # The two CLI entry points intentionally share error handling.
    "too-many-instance-attributes", # IncidentContext is a schema, not behavior-rich state.
]
